name: ci

on:
  push:
    branches: [ main, ES51 ]
  pull_request:
    branches: [ main, ES51 ]

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1        # sets up cl.exe for VS 2022 x64
    - name: Build & test
      run: .\build.cmd                    # your script handles everything
    - name: Compile depth on a 512 KB stack
      run: .\tools\stackDepthCheck.cmd

  macos-clang:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build & test
      run: |
        chmod +x ./build.sh               # ensure it is executable
        ./build.sh
    - name: Compile depth on a 512 KB stack
      run: bash ./tools/stackDepthCheck.sh
        
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build & test
      run: |
        chmod +x ./build.sh
        ./build.sh
    - name: Compile depth on a 512 KB stack
      run: bash ./tools/stackDepthCheck.sh

  # The sanitizers don't see reads of uninitialized memory, Valgrind does. NuXJSTest runs its checks and then the
  # corpus replay that buildAndTest.sh runs, in a plain beta build.
  linux-valgrind:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: NuXJSTest and the fuzz corpus under Valgrind
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq valgrind
        mkdir -p output/fuzzReplay
        bash ./tools/BuildCpp.sh beta native output/NuXJSTest tools/NuXJSTest.cpp src/NuXJS.cpp src/stdlibJS.cpp
        tar -xzf tests/fuzz/corpus.tar.gz --strip-components=1 -C output/fuzzReplay
        find output/fuzzReplay -type f > output/fuzzReplay.txt
        valgrind -q --error-exitcode=1 ./output/NuXJSTest output/fuzzReplay.txt
